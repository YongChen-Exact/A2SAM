train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /data/chenyong/codes/A2SAM/data/DRIVE/training/images
      root_path_2: /data/chenyong/codes/A2SAM/data/DRIVE/training/1st_manual
      root_path_3: /data/chenyong/codes/A2SAM/data/DRIVE/training/uncertainty
      root_path_4: /data/chenyong/codes/A2SAM/data/DRIVE/training/logit
      cache: none
      split_key: train
  wrapper:
    name: train
    args:
      inp_size: 1024
      augment: false
      original_size: (584, 565)
  batch_size: 1

val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /data/chenyong/codes/A2SAM/data/DRIVE/test/images
      root_path_2: /data/chenyong/codes/A2SAM/data/DRIVE/test/1st_manual
      root_path_3: /data/chenyong/codes/A2SAM/data/DRIVE/test/uncertainty
      root_path_4: /data/chenyong/codes/A2SAM/data/DRIVE/test/logit
      cache: none
      split_key: test
  wrapper:
    name: val
    args:
      inp_size: 1024
      original_size: (584, 565)
  batch_size: 1

test_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /data/chenyong/codes/A2SAM/data/DRIVE/test/images
      root_path_2: /data/chenyong/codes/A2SAM/data/DRIVE/test/1st_manual
      root_path_3: /data/chenyong/codes/A2SAM/data/DRIVE/test/uncertainty
      root_path_4: /data/chenyong/codes/A2SAM/data/DRIVE/test/logit
      cache: none
      split_key: test
  wrapper:
    name: test
    args:
      inp_size: 1024
      original_size: (584, 565)
  batch_size: 1

eval_type: cod
sam_checkpoint: /data/chenyong/codes/A2SAM/pretrained/sam_vit_b_01ec64.pth
data_norm:
  inp:
    sub:
    - 0.5
    div:
    - 0.5
  gt:
    sub:
    - 0.5
    div:
    - 0.5
  gt_rgb:
    sub:
    - 0.5
    div:
    - 0.5
model:
  name: a2sam # a2sam, sam
  args:
    inp_size: 1024
    loss: bce_iou_ta
    encoder_mode:
      name: sam
      img_size: 1024
      original_size: (584, 565)
      mlp_ratio: 4
      patch_size: 16
      qkv_bias: true
      use_rel_pos: true
      window_size: 14
      out_chans: 256
      scale_factor: 32
      input_type: fft
      freq_nums: 0.25
      prompt_type: highpass
      prompt_embed_dim: 256
      tuning_stage: 1234
      handcrafted_tune: true
      embedding_tune: true
      adaptor: adaptor
      embed_dim: 768
      depth: 12
      num_heads: 12
      global_attn_indexes:
      - 2
      - 5
      - 8
      - 11
optimizer:
  name: adamw
  args:
    lr: 0.0002
lr_min: 1.0e-7
epoch_max: 50

multi_step_lr:
  milestones:
  - 1
  gamma: 0.1
epoch_val: 1
epoch_save: 1

#resume: 60
#start_epoch: 60
